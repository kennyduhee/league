<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>2026 저학년 조별리그 순위표</title>
  <style>
    :root {
      --naver-green: #03c75a;
      --bg-dark: #1a1a1a;
      --bg-card: #242424;
      --bg-header: #111;
      --text-primary: #fff;
      --text-secondary: #999;
      --border: #333;
      --highlight: rgba(3, 199, 90, 0.12);
      --top-rank: #03c75a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "Noto Sans KR", sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      background: var(--bg-header);
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .group-tabs {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 62px;
      z-index: 99;
    }

    .group-tabs::-webkit-scrollbar {
      display: none;
    }

    .group-tab {
      flex-shrink: 0;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .group-tab.active {
      background: var(--naver-green);
      border-color: var(--naver-green);
      color: #fff;
    }

    .content {
      padding: 0 0 24px;
    }

    .group-panel {
      display: none;
    }

    .group-panel.active {
      display: block;
    }

    .group-info {
      padding: 16px 20px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .group-name {
      font-size: 16px;
      font-weight: 700;
    }

    .group-meta {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .legend {
      display: flex;
      gap: 12px;
      padding: 0 20px 12px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--naver-green);
    }

    .standings-table {
      width: 100%;
      border-collapse: collapse;
    }

    .standings-table thead th {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 500;
      padding: 8px 4px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }

    .standings-table thead th:first-child {
      padding-left: 16px;
      text-align: left;
      width: 36px;
    }

    .standings-table thead th:nth-child(2) {
      text-align: left;
      min-width: 100px;
    }

    .standings-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .standings-table tbody tr.top-rank {
      background: var(--highlight);
    }

    .standings-table tbody td {
      font-size: 13px;
      padding: 14px 4px;
      text-align: center;
      vertical-align: middle;
    }

    .standings-table tbody td:first-child {
      padding-left: 16px;
      text-align: left;
      font-weight: 700;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .standings-table tbody tr.top-rank td:first-child {
      color: var(--top-rank);
    }

    .standings-table tbody td:nth-child(2) {
      text-align: left;
      font-weight: 600;
      font-size: 13px;
      padding-right: 8px;
      word-break: keep-all;
      line-height: 1.3;
    }

    .standings-table tbody td.pts {
      font-weight: 700;
      font-size: 15px;
      color: var(--naver-green);
    }

    .standings-table tbody tr.top-rank td.pts {
      color: var(--naver-green);
    }

    .gd-positive {
      color: var(--naver-green);
    }

    .gd-negative {
      color: #ff6b6b;
    }

    .footer-note {
      padding: 16px 20px;
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    @media (min-width: 600px) {
      body {
        max-width: 480px;
        margin: 0 auto;
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-title">2026 저학년 조별리그</div>
    <div class="header-sub">효창운동장 · 경기결과 06/26 기준</div>
  </header>

  <nav class="group-tabs" id="groupTabs"></nav>

  <main class="content" id="content"></main>

  <div class="footer-note">
    승점: 승 3점 · 무 1점 · 패 0점<br>
    동률 시 득실차 → 다득점 순으로 순위 결정<br>
    서울3조는 1차리그 진행 중 (5팀, 일부 경기 미진행)
  </div>

  <script>
    const STANDINGS = {
      "서울1": [
        { rank: 1, team: "DTFCU12", played: 2, won: 1, drawn: 1, lost: 0, gf: 21, ga: 2, gd: 19, pts: 4 },
        { rank: 2, team: "충암U12", played: 2, won: 1, drawn: 1, lost: 0, gf: 8, ga: 3, gd: 5, pts: 4 },
        { rank: 3, team: "FC아쏘", played: 2, won: 1, drawn: 0, lost: 1, gf: 11, ga: 4, gd: 7, pts: 3 },
        { rank: 4, team: "K리거강용FC", played: 2, won: 1, drawn: 0, lost: 1, gf: 5, ga: 3, gd: 2, pts: 3 },
        { rank: 5, team: "유석U12", played: 2, won: 1, drawn: 0, lost: 1, gf: 3, ga: 7, gd: -4, pts: 3 },
        { rank: 6, team: "화랑U12", played: 2, won: 0, drawn: 0, lost: 2, gf: 0, ga: 29, gd: -29, pts: 0 }
      ],
      "서울2": [
        { rank: 1, team: "JCMFCU12", played: 2, won: 2, drawn: 0, lost: 0, gf: 9, ga: 1, gd: 8, pts: 6 },
        { rank: 2, team: "FC난우", played: 2, won: 2, drawn: 0, lost: 0, gf: 8, ga: 2, gd: 6, pts: 6 },
        { rank: 3, team: "영등포구스포츠클럽U12", played: 2, won: 1, drawn: 0, lost: 1, gf: 5, ga: 5, gd: 0, pts: 3 },
        { rank: 4, team: "AAFCU12", played: 2, won: 1, drawn: 0, lost: 1, gf: 4, ga: 4, gd: 0, pts: 3 },
        { rank: 5, team: "양강초", played: 2, won: 0, drawn: 0, lost: 2, gf: 1, ga: 5, gd: -4, pts: 0 },
        { rank: 6, team: "FC풀굿코리아U12", played: 2, won: 0, drawn: 0, lost: 2, gf: 1, ga: 11, gd: -10, pts: 0 }
      ],
      "서울3": [
        { rank: 1, team: "전농초", played: 2, won: 2, drawn: 0, lost: 0, gf: 5, ga: 2, gd: 3, pts: 6 },
        { rank: 2, team: "FC은평U12", played: 2, won: 1, drawn: 1, lost: 0, gf: 3, ga: 2, gd: 1, pts: 4 },
        { rank: 3, team: "신답FCU12", played: 2, won: 0, drawn: 1, lost: 1, gf: 1, ga: 3, gd: -2, pts: 1 },
        { rank: 4, team: "우이초", played: 1, won: 0, drawn: 0, lost: 1, gf: 2, ga: 3, gd: -1, pts: 0 },
        { rank: 5, team: "최강희축구교실", played: 1, won: 0, drawn: 0, lost: 1, gf: 1, ga: 2, gd: -1, pts: 0 }
      ],
      "서울4": [
        { rank: 1, team: "송파구유소년축구단", played: 2, won: 2, drawn: 0, lost: 0, gf: 12, ga: 3, gd: 9, pts: 6 },
        { rank: 2, team: "송파구FCPS", played: 2, won: 1, drawn: 1, lost: 0, gf: 8, ga: 7, gd: 1, pts: 4 },
        { rank: 3, team: "송파구JD풋볼아카데미", played: 2, won: 1, drawn: 0, lost: 1, gf: 6, ga: 4, gd: 2, pts: 3 },
        { rank: 4, team: "JP연세FCU12", played: 2, won: 1, drawn: 0, lost: 1, gf: 6, ga: 5, gd: 1, pts: 3 },
        { rank: 5, team: "NUFCU12", played: 2, won: 0, drawn: 1, lost: 1, gf: 6, ga: 10, gd: -4, pts: 1 },
        { rank: 6, team: "서강초", played: 2, won: 0, drawn: 0, lost: 2, gf: 3, ga: 12, gd: -9, pts: 0 }
      ],
      "서울5": [
        { rank: 1, team: "노원FC한마음U12", played: 2, won: 2, drawn: 0, lost: 0, gf: 9, ga: 2, gd: 7, pts: 6 },
        { rank: 2, team: "신용산초", played: 2, won: 1, drawn: 1, lost: 0, gf: 4, ga: 1, gd: 3, pts: 4 },
        { rank: 3, team: "관악FCU12", played: 2, won: 1, drawn: 0, lost: 1, gf: 11, ga: 3, gd: 8, pts: 3 },
        { rank: 4, team: "FC서울 U-12", played: 2, won: 1, drawn: 0, lost: 1, gf: 4, ga: 7, gd: -3, pts: 3 },
        { rank: 5, team: "UKFCU12", played: 2, won: 0, drawn: 1, lost: 1, gf: 2, ga: 5, gd: -3, pts: 1 },
        { rank: 6, team: "서초MB U-12", played: 2, won: 0, drawn: 0, lost: 2, gf: 0, ga: 12, gd: -12, pts: 0 }
      ],
      "서울6": [
        { rank: 1, team: "이랜드FCU12", played: 2, won: 2, drawn: 0, lost: 0, gf: 10, ga: 3, gd: 7, pts: 6 },
        { rank: 2, team: "위례FCU12", played: 2, won: 2, drawn: 0, lost: 0, gf: 8, ga: 5, gd: 3, pts: 6 },
        { rank: 3, team: "GWFCU12", played: 2, won: 1, drawn: 0, lost: 1, gf: 8, ga: 7, gd: 1, pts: 3 },
        { rank: 4, team: "삼선FCU12", played: 2, won: 1, drawn: 0, lost: 1, gf: 4, ga: 5, gd: -1, pts: 3 },
        { rank: 5, team: "성동SCU12", played: 2, won: 0, drawn: 0, lost: 2, gf: 4, ga: 7, gd: -3, pts: 0 },
        { rank: 6, team: "대동초", played: 2, won: 0, drawn: 0, lost: 2, gf: 3, ga: 10, gd: -7, pts: 0 }
      ]
    };

    const GROUPS = Object.keys(STANDINGS);
    let activeGroup = GROUPS[0];

    function formatGd(gd) {
      const cls = gd > 0 ? "gd-positive" : gd < 0 ? "gd-negative" : "";
      const text = gd > 0 ? `+${gd}` : String(gd);
      return `<span class="${cls}">${text}</span>`;
    }

    function renderTabs() {
      const tabs = document.getElementById("groupTabs");
      tabs.innerHTML = GROUPS.map((g) =>
        `<button class="group-tab${g === activeGroup ? " active" : ""}" data-group="${g}">${g}</button>`
      ).join("");
      tabs.querySelectorAll(".group-tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          activeGroup = btn.dataset.group;
          renderTabs();
          renderContent();
        });
      });
    }

    function renderContent() {
      const content = document.getElementById("content");
      content.innerHTML = GROUPS.map((g) => {
        const rows = STANDINGS[g];
        const isActive = g === activeGroup;
        const teamCount = rows.length;
        const maxPlayed = Math.max(...rows.map((r) => r.played));

        return `
          <section class="group-panel${isActive ? " active" : ""}" id="panel-${g}">
            <div class="group-info">
              <span class="group-name">${g}조</span>
              <span class="group-meta">${teamCount}팀 · ${maxPlayed}경기 진행</span>
            </div>
            <div class="legend">
              <span class="legend-item"><span class="legend-dot"></span> 상위권</span>
            </div>
            <table class="standings-table">
              <thead>
                <tr>
                  <th>순위</th>
                  <th>팀</th>
                  <th>경기</th>
                  <th>승</th>
                  <th>무</th>
                  <th>패</th>
                  <th>득</th>
                  <th>실</th>
                  <th>득실</th>
                  <th>승점</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map((r) => `
                  <tr class="${r.rank <= 2 ? "top-rank" : ""}">
                    <td>${r.rank}</td>
                    <td>${r.team}</td>
                    <td>${r.played}</td>
                    <td>${r.won}</td>
                    <td>${r.drawn}</td>
                    <td>${r.lost}</td>
                    <td>${r.gf}</td>
                    <td>${r.ga}</td>
                    <td>${formatGd(r.gd)}</td>
                    <td class="pts">${r.pts}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </section>
        `;
      }).join("");
    }

    renderTabs();
    renderContent();
  </script>
</body>
</html>
